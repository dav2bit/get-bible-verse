<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {box-sizing: border-box ; margin: 5px; padding: 0;}
body {font-family: Verdana, sans-serif; margin:0 ; }
.mySlides {display: none}


/* Slideshow container */
.slideshow-container {
  width: 100%;
  position: relative;
  margin: auto;
  height: 100vh;
}



.slide_verse_addres {
  color: #000000;
  font-size: 3vw;
  width: 100%;

}


.slide_verse {
  color: #000000;
  font-size: 2vw;
  padding: 8px 12px;
  width: 100%;

}

/* Number text (1/3 etc) */
.numbertext {
  color: #f2f2f2;
  font-size: 12px;
  padding: 8px 12px;
  position: absolute;
  top: 0;
}

@keyframes fade {
  from {opacity: .4} 
  to {opacity: 1}
}

/* On smaller screens, decrease text size */
@media only screen and (max-width: 300px) {
  .prev, .next,.text {font-size: 11px}
}


</style>
</head>
<body>

<div class="slideshow-container">
</div>
<br>
<script>
const bc = new BroadcastChannel('my_app_channel');

let slideIndex = 1;
showSlides({id:slideIndex});

function plusSlides(arg) {
  let n = arg.id

  showSlides({id: slideIndex += n});
}

function showSlides(arg) {
  let n = arg.id
  let i;
  let slides = document.getElementsByClassName("mySlides");
  console.log(slides)
  if(slides.length == 0){
    return
  }
  if (n > slides.length) {slideIndex = 1}    
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";  
  }

  slides[slideIndex-1].style.display = "block";  

}

function changeSlideIndex(arg){
  let n = arg.id
  
  slideIndex = n
}



function addSlides(arg) {
    let verse = arg.verse
    let addres = arg.addres

   document.querySelector(".slideshow-container").innerHTML = ""
   
  for (let i = 0; i < verse.length; i++) {
    let el = document.createElement("div")
    el.classList.add('my-new-class'); 
    el.innerHTML = `<div class="mySlides fade">

      <div class="text">

        <h1 class="slide_verse_addres">${addres}</h1>
        <p class="slide_verse">${verse[i]}</h1>

        </div>
    </div>`;
    document.querySelector(".slideshow-container").appendChild(el)
  }
    
}

// Երբ պատուհանը (փոքրը) փակվում է
window.onbeforeunload = function() {
    localStorage.removeItem('popupActive');
};


bc.onmessage = (msg) => {
    if (msg.data.type === 'CALL_FUNCTION') {
        const { name, args } = msg.data.payload;
        
        // Կանչում ենք ֆունկցիան ըստ անունի
        if (name === 'changeSlideIndex') changeSlideIndex(args);
        if (name === 'showSlides') showSlides(args);
        if (name === 'plusSlides') plusSlides(args);
        if (name === 'addSlides') addSlides(args);


    }
};

</script>

</body>
</html>
